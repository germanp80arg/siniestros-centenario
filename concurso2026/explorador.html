<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de siniestros viales | Centenario</title>
  <link rel="stylesheet" href="../condatos/css/leaflet.css">
  <style>
    :root { --ink:#263238; --muted:#66727a; --line:#dfe5e8; --panel:#ffffff; --soft:#f4f7f8; --accent:#245a78; }
    html, body { width:100%; height:100%; margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#eef2f3; }
    .layout { display:grid; grid-template-columns:minmax(0, 1fr) 330px; height:100%; }
    #map { min-height:520px; height:100%; }
    .side { background:rgba(255,255,255,.98); border-left:1px solid var(--line); padding:18px; overflow:auto; box-sizing:border-box; }
    h1 { font-size:19px; margin:0 0 5px; }
    .intro { font-size:12px; line-height:1.45; color:var(--muted); margin:0 0 15px; }
    .filters { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .field label { display:block; font-size:11px; font-weight:700; margin:0 0 4px; }
    select { width:100%; box-sizing:border-box; padding:7px 8px; border:1px solid #bfc9ce; border-radius:6px; background:#fff; font-size:12px; }
    .reset { width:100%; margin:10px 0 14px; padding:8px; border:0; border-radius:6px; background:#39464c; color:white; cursor:pointer; }
    .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; margin-bottom:14px; }
    .card { background:var(--soft); border:1px solid var(--line); border-radius:7px; padding:8px 5px; text-align:center; }
    .card strong { display:block; font-size:18px; }
    .card span { display:block; font-size:9px; color:var(--muted); line-height:1.2; margin-top:2px; }
    .chart-head { display:flex; gap:8px; align-items:center; justify-content:space-between; margin:2px 0 8px; }
    .chart-head h2 { font-size:13px; margin:0; }
    .chart-head select { width:130px; }
    .bars { display:flex; flex-direction:column; gap:7px; }
    .bar-row { display:grid; grid-template-columns:86px 1fr 28px; gap:6px; align-items:center; font-size:10px; }
    .bar-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bar-track { height:12px; background:#e6ecef; border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--accent); border-radius:8px; min-width:2px; }
    .bar-value { text-align:right; font-weight:700; }
    .note { font-size:9px; line-height:1.4; color:#7a858b; margin:13px 0 0; }
    .popup-table { border-collapse:collapse; font-size:12px; min-width:230px; }
    .popup-table th,.popup-table td { text-align:left; vertical-align:top; padding:3px 5px; border-bottom:1px solid #eee; }
    .popup-table th { white-space:nowrap; }
    @media(max-width:760px){
      .layout { grid-template-columns:1fr; grid-template-rows:55vh auto; height:auto; min-height:100%; }
      #map { min-height:55vh; }
      .side { border-left:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="map"></div>
  <aside class="side">
    <h1>Explorá los siniestros</h1>
    <p class="intro">Combiná filtros y observá cómo cambia la distribución espacial y estadística de los hechos visibles.</p>

    <div class="filters">
      <div class="field">
        <label for="filterType">Tipo</label>
        <select id="filterType">
          <option value="all">Todos</option>
          <option value="Choque">Choques</option>
          <option value="Atropello">Atropellos</option>
          <option value="Vuelco">Vuelcos</option>
          <option value="Derrape / caída / despiste">Derrapes / caídas / despistes</option>
          <option value="Otros">Otros</option>
        </select>
      </div>
      <div class="field">
        <label for="filterMonth">Mes</label>
        <select id="filterMonth"><option value="all">Todos</option></select>
      </div>
      <div class="field">
        <label for="filterDay">Día</label>
        <select id="filterDay">
          <option value="all">Todos</option>
          <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
          <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option>
        </select>
      </div>
      <div class="field">
        <label for="filterSector">Sector</label>
        <select id="filterSector">
          <option value="all">Toda el área</option>
          <option value="ruta7">Ruta 7 y rotondas</option>
          <option value="resto">Resto de la ciudad</option>
        </select>
      </div>
    </div>

    <button class="reset" id="resetFilters">Restablecer filtros</button>

    <div class="cards">
      <div class="card"><strong id="visibleCount">0</strong><span>casos visibles</span></div>
      <div class="card"><strong id="routeShare">0%</strong><span>en Ruta 7</span></div>
      <div class="card"><strong id="weekendShare">0%</strong><span>fin de semana</span></div>
    </div>

    <div class="chart-head">
      <h2>Distribución de la selección</h2>
      <select id="chartDimension">
        <option value="type">por tipo</option>
        <option value="month">por mes</option>
        <option value="day">por día</option>
        <option value="sector">por sector</option>
      </select>
    </div>
    <div id="bars" class="bars"></div>
    <p class="note">El gráfico se recalcula automáticamente cada vez que cambia la selección del mapa.</p>
  </aside>
</div>

<script src="../condatos/js/leaflet.js"></script>
<script src="../condatos/data/ejidoCente_1.js"></script>
<script src="../condatos/data/manchaurbana2021_2.js"></script>
<script src="../condatos/data/Siniestrostodoshastaenero_3.js"></script>
<script>
  const map = L.map('map', {zoomControl:true, minZoom:1, maxZoom:20}).setView([-38.828,-68.132],13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, opacity:.84, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  if (typeof json_ejidoCente_1 !== 'undefined') {
    L.geoJSON(json_ejidoCente_1,{interactive:false,style:{color:'#455a64',weight:2,dashArray:'6,4',fillOpacity:0}}).addTo(map);
  }
  if (typeof json_manchaurbana2021_2 !== 'undefined') {
    L.geoJSON(json_manchaurbana2021_2,{interactive:false,style:{color:'#78909c',weight:1.5,dashArray:'7,5',fillOpacity:0}}).addTo(map);
  }

  const allFeatures = json_Siniestrostodoshastaenero_3.features || [];
  let accidentLayer = null;
  const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  function norm(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function broadType(f){
    const t=norm(f.properties?.tipo);
    if(t.includes('atropell')) return 'Atropello';
    if(t.includes('vuelco')) return 'Vuelco';
    if(t.includes('derrape')||t.includes('caida')||t.includes('despiste')||t.includes('desvio')) return 'Derrape / caída / despiste';
    if(t.includes('choque')||t.includes('colision')) return 'Choque';
    return 'Otros';
  }
  function dateObj(f){
    const v=f.properties?.fecha;
    return v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T12:00:00') : null;
  }
  function monthKey(f){
    const v=f.properties?.fecha;
    return v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.slice(0,7) : null;
  }
  function isRoute7(f){
    const s=norm(f.properties?.ubicacion);
    return s.includes('ruta 7')||s.includes('rotonda')||s.includes('ex peaje')||s.includes('expeaje');
  }
  function safe(v){
    if(v===null||v===undefined||v==='') return 'Sin dato';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  function sourceHtml(v){
    if(!v) return 'Sin dato';
    const s=String(v);
    return /^https?:\/\//i.test(s) ? '<a href="'+safe(s)+'" target="_blank" rel="noopener">Ver fuente</a>' : safe(s);
  }
  function popupHtml(f){
    const p=f.properties||{};
    return '<table class="popup-table">'+
      '<tr><th>Fecha</th><td>'+safe(p.fecha)+'</td></tr>'+
      '<tr><th>Hora</th><td>'+safe(p.hora)+'</td></tr>'+
      '<tr><th>Ubicación</th><td>'+safe(p.ubicacion)+'</td></tr>'+
      '<tr><th>Tipo</th><td>'+safe(p.tipo)+'</td></tr>'+
      '<tr><th>Vehículos</th><td>'+safe(p.vehiculos)+'</td></tr>'+
      '<tr><th>Descripción</th><td>'+safe(p.descripcio)+'</td></tr>'+
      '<tr><th>Alcohol</th><td>'+safe(p.alcohol)+'</td></tr>'+
      '<tr><th>Fuente</th><td>'+sourceHtml(p.fuente)+'</td></tr>'+
      '</table>';
  }

  function populateMonths(){
    const sel=document.getElementById('filterMonth');
    [...new Set(allFeatures.map(monthKey).filter(Boolean))].sort().forEach(k=>{
      const [y,m]=k.split('-').map(Number);
      const o=document.createElement('option');
      o.value=k; o.textContent=monthNames[m-1]+' '+y; sel.appendChild(o);
    });
  }
  function filters(){
    return {
      type:document.getElementById('filterType').value,
      month:document.getElementById('filterMonth').value,
      day:document.getElementById('filterDay').value,
      sector:document.getElementById('filterSector').value
    };
  }
  function matches(f,x){
    if(x.type!=='all' && broadType(f)!==x.type) return false;
    if(x.month!=='all' && monthKey(f)!==x.month) return false;
    if(x.day!=='all'){
      const d=dateObj(f); if(!d || String(d.getDay())!==x.day) return false;
    }
    if(x.sector==='ruta7' && !isRoute7(f)) return false;
    if(x.sector==='resto' && isRoute7(f)) return false;
    return true;
  }
  function groupData(features,dimension){
    const counts={};
    features.forEach(f=>{
      let key='Sin dato';
      if(dimension==='type') key=broadType(f);
      if(dimension==='month'){
        const mk=monthKey(f);
        if(mk){ const [y,m]=mk.split('-').map(Number); key=monthNames[m-1]+' '+String(y).slice(-2); }
      }
      if(dimension==='day'){ const d=dateObj(f); key=d?dayNames[d.getDay()]:'Sin dato'; }
      if(dimension==='sector') key=isRoute7(f)?'Ruta 7':'Resto';
      counts[key]=(counts[key]||0)+1;
    });
    let arr=Object.entries(counts).map(([label,value])=>({label,value}));
    if(dimension==='month'){
      const order={Ene:1,Feb:2,Mar:3,Abr:4,May:5,Jun:6,Jul:7,Ago:8,Sep:9,Oct:10,Nov:11,Dic:12};
      arr.sort((a,b)=>{
        const ay=Number(a.label.slice(-2)), by=Number(b.label.slice(-2));
        if(ay!==by) return ay-by;
        return (order[a.label.slice(0,3)]||99)-(order[b.label.slice(0,3)]||99);
      });
    } else if(dimension==='day'){
      const order=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
      arr.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));
    } else arr.sort((a,b)=>b.value-a.value);
    return arr;
  }
  function renderBars(features){
    const dim=document.getElementById('chartDimension').value;
    const data=groupData(features,dim);
    const max=Math.max(1,...data.map(d=>d.value));
    const box=document.getElementById('bars');
    box.innerHTML='';
    data.forEach(d=>{
      const row=document.createElement('div'); row.className='bar-row';
      row.innerHTML='<div class="bar-label" title="'+safe(d.label)+'">'+safe(d.label)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+((d.value/max)*100).toFixed(1)+'%"></div></div>'+
        '<div class="bar-value">'+d.value+'</div>';
      box.appendChild(row);
    });
    if(!data.length) box.innerHTML='<div style="font-size:11px;color:#777">No hay casos para esta combinación de filtros.</div>';
  }
  function render(){
    const visible=allFeatures.filter(f=>matches(f,filters()));
    if(accidentLayer) map.removeLayer(accidentLayer);
    accidentLayer=L.geoJSON({type:'FeatureCollection',features:visible},{
      pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,weight:1,color:'#5c2020',fillColor:'#d84343',fillOpacity:.86}),
      onEachFeature:(f,l)=>l.bindPopup(popupHtml(f),{maxWidth:360,maxHeight:420})
    }).addTo(map);

    document.getElementById('visibleCount').textContent=visible.length;
    const route=visible.filter(isRoute7).length;
    const weekend=visible.filter(f=>{const d=dateObj(f); return d && (d.getDay()===0||d.getDay()===6);}).length;
    document.getElementById('routeShare').textContent=visible.length?Math.round(route*100/visible.length)+'%':'0%';
    document.getElementById('weekendShare').textContent=visible.length?Math.round(weekend*100/visible.length)+'%':'0%';
    renderBars(visible);
  }

  populateMonths();
  ['filterType','filterMonth','filterDay','filterSector'].forEach(id=>document.getElementById(id).addEventListener('change',render));
  document.getElementById('chartDimension').addEventListener('change',()=>renderBars(allFeatures.filter(f=>matches(f,filters()))));
  document.getElementById('resetFilters').addEventListener('click',()=>{
    ['filterType','filterMonth','filterDay','filterSector'].forEach(id=>document.getElementById(id).value='all');
    render();
  });
  render();
</script>
</body>
</html>
