<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de filtros | Siniestros viales de Centenario</title>
  <link rel="stylesheet" href="condatos/css/leaflet.css">
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    #filterPanel {
      position: absolute;
      z-index: 1000;
      top: 14px;
      right: 14px;
      width: 290px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      box-sizing: border-box;
      background: rgba(255,255,255,0.96);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      padding: 14px;
    }
    #filterPanel h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      line-height: 1.2;
      color: #222;
    }
    #filterPanel .subtitle {
      margin: 0 0 12px 0;
      font-size: 12px;
      line-height: 1.35;
      color: #555;
    }
    .filter-group {
      margin-bottom: 10px;
    }
    .filter-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #333;
    }
    .filter-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
      font-size: 13px;
    }
    #resultBox {
      margin-top: 12px;
      padding: 10px;
      border-radius: 7px;
      background: #f1f3f5;
      text-align: center;
    }
    #resultCount {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #222;
    }
    #resultLabel {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #555;
    }
    #resetFilters {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: 0;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    #resetFilters:hover {
      background: #555;
    }
    .prototype-note {
      margin: 9px 0 0 0;
      font-size: 10px;
      line-height: 1.3;
      color: #777;
    }
    .popup-table {
      border-collapse: collapse;
      font-size: 12px;
      min-width: 220px;
    }
    .popup-table th,
    .popup-table td {
      text-align: left;
      vertical-align: top;
      padding: 3px 5px;
      border-bottom: 1px solid #eee;
    }
    .popup-table th {
      white-space: nowrap;
    }
    @media (max-width: 650px) {
      #filterPanel {
        top: auto;
        right: 8px;
        left: 8px;
        bottom: 8px;
        width: auto;
        max-height: 47vh;
        padding: 11px;
      }
      #filterPanel h1 {
        font-size: 16px;
      }
      .filter-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .filter-group {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="filterPanel">
    <h1>Explorá los siniestros</h1>
    <p class="subtitle">Combiná los filtros para observar cómo se distribuyen los hechos registrados en Centenario.</p>

    <div class="filter-grid">
      <div class="filter-group">
        <label for="filterType">Tipo de hecho</label>
        <select id="filterType">
          <option value="all">Todos</option>
          <option value="Choque">Choques</option>
          <option value="Atropello">Atropellos</option>
          <option value="Vuelco">Vuelcos</option>
          <option value="Derrape / caída / despiste">Derrapes, caídas y despistes</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterMonth">Mes</label>
        <select id="filterMonth">
          <option value="all">Todos</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterDay">Día de la semana</label>
        <select id="filterDay">
          <option value="all">Todos</option>
          <option value="1">Lunes</option>
          <option value="2">Martes</option>
          <option value="3">Miércoles</option>
          <option value="4">Jueves</option>
          <option value="5">Viernes</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterSector">Sector</label>
        <select id="filterSector">
          <option value="all">Toda el área</option>
          <option value="ruta7">Ruta 7 y rotondas</option>
          <option value="resto">Resto de la ciudad</option>
        </select>
      </div>
    </div>

    <div id="resultBox">
      <span id="resultCount">0</span>
      <span id="resultLabel">hechos visibles</span>
    </div>

    <button id="resetFilters" type="button">Restablecer filtros</button>
    <p class="prototype-note">Versión de prueba. Los filtros actúan sobre la base actualmente publicada en el visor.</p>
  </div>

  <script src="condatos/js/leaflet.js"></script>
  <script src="condatos/data/ejidoCente_1.js"></script>
  <script src="condatos/data/manchaurbana2021_2.js"></script>
  <script src="condatos/data/Siniestrostodoshastaenero_3.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true, minZoom: 1, maxZoom: 28 })
      .setView([-38.828, -68.132], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      opacity: 0.82,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    if (typeof json_ejidoCente_1 !== 'undefined') {
      L.geoJSON(json_ejidoCente_1, {
        interactive: false,
        style: {
          color: '#333',
          weight: 2,
          dashArray: '6,4',
          fillOpacity: 0
        }
      }).addTo(map);
    }

    if (typeof json_manchaurbana2021_2 !== 'undefined') {
      L.geoJSON(json_manchaurbana2021_2, {
        interactive: false,
        style: {
          color: '#777',
          weight: 2,
          dashArray: '8,5',
          fillOpacity: 0
        }
      }).addTo(map);
    }

    const allFeatures = json_Siniestrostodoshastaenero_3.features || [];
    const markerIcon = L.icon({
      iconUrl: 'condatos/markers/Siniestrostodoshastaenero_3.svg',
      iconSize: [21.28, 21.28],
      iconAnchor: [10.64, 10.64],
      popupAnchor: [0, -8]
    });

    let accidentLayer = null;

    const monthNames = [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'
    ];

    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function broadType(feature) {
      const t = normalizeText(feature.properties && feature.properties.tipo);
      if (t.includes('atropell')) return 'Atropello';
      if (t.includes('vuelco')) return 'Vuelco';
      if (t.includes('derrape') || t.includes('caida') || t.includes('despiste') || t.includes('desvio')) {
        return 'Derrape / caída / despiste';
      }
      if (t.includes('choque') || t.includes('colision')) return 'Choque';
      return 'Otros';
    }

    function featureDate(feature) {
      const value = feature.properties && feature.properties.fecha;
      if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      return new Date(value + 'T12:00:00');
    }

    function monthKey(feature) {
      const value = feature.properties && feature.properties.fecha;
      if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      return value.slice(0, 7);
    }

    function isRoute7(feature) {
      const p = feature.properties || {};
      const location = normalizeText(p.ubicacion);
      return location.includes('ruta 7') ||
             location.includes('rotonda') ||
             location.includes('ex peaje') ||
             location.includes('expeaje');
    }

    function safe(value) {
      if (value === null || value === undefined || value === '') return 'Sin dato';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sourceHtml(value) {
      if (!value) return 'Sin dato';
      const url = String(value);
      if (/^https?:\/\//i.test(url)) {
        return '<a href="' + safe(url) + '" target="_blank" rel="noopener">Ver fuente</a>';
      }
      return safe(url);
    }

    function popupHtml(feature) {
      const p = feature.properties || {};
      return '<table class="popup-table">' +
        '<tr><th>Fecha</th><td>' + safe(p.fecha) + '</td></tr>' +
        '<tr><th>Hora</th><td>' + safe(p.hora) + '</td></tr>' +
        '<tr><th>Ubicación</th><td>' + safe(p.ubicacion) + '</td></tr>' +
        '<tr><th>Tipo</th><td>' + safe(p.tipo) + '</td></tr>' +
        '<tr><th>Vehículos</th><td>' + safe(p.vehiculos) + '</td></tr>' +
        '<tr><th>Descripción</th><td>' + safe(p.descripcio) + '</td></tr>' +
        '<tr><th>Alcohol</th><td>' + safe(p.alcohol) + '</td></tr>' +
        '<tr><th>Heridos</th><td>' + safe(p.heridos) + '</td></tr>' +
        '<tr><th>Fuente</th><td>' + sourceHtml(p.fuente) + '</td></tr>' +
        '</table>';
    }

    function populateMonths() {
      const select = document.getElementById('filterMonth');
      const months = [...new Set(allFeatures.map(monthKey).filter(Boolean))].sort();
      months.forEach(key => {
        const parts = key.split('-');
        const year = Number(parts[0]);
        const month = Number(parts[1]);
        const option = document.createElement('option');
        option.value = key;
        option.textContent = monthNames[month - 1].charAt(0).toUpperCase() + monthNames[month - 1].slice(1) + ' ' + year;
        select.appendChild(option);
      });
    }

    function currentFilters() {
      return {
        type: document.getElementById('filterType').value,
        month: document.getElementById('filterMonth').value,
        day: document.getElementById('filterDay').value,
        sector: document.getElementById('filterSector').value
      };
    }

    function featureMatches(feature, filters) {
      if (filters.type !== 'all' && broadType(feature) !== filters.type) return false;

      if (filters.month !== 'all' && monthKey(feature) !== filters.month) return false;

      if (filters.day !== 'all') {
        const d = featureDate(feature);
        if (!d || String(d.getDay()) !== filters.day) return false;
      }

      if (filters.sector === 'ruta7' && !isRoute7(feature)) return false;
      if (filters.sector === 'resto' && isRoute7(feature)) return false;

      return true;
    }

    function renderFeatures() {
      const filters = currentFilters();
      const visible = allFeatures.filter(feature => featureMatches(feature, filters));

      if (accidentLayer) map.removeLayer(accidentLayer);

      accidentLayer = L.geoJSON({ type: 'FeatureCollection', features: visible }, {
        pointToLayer: function(feature, latlng) {
          return L.marker(latlng, { icon: markerIcon });
        },
        onEachFeature: function(feature, layer) {
          layer.bindPopup(popupHtml(feature), { maxWidth: 360, maxHeight: 420 });
        }
      }).addTo(map);

      document.getElementById('resultCount').textContent = visible.length + ' de ' + allFeatures.length;
      document.getElementById('resultLabel').textContent = visible.length === 1 ? 'hecho visible' : 'hechos visibles';
    }

    populateMonths();

    ['filterType', 'filterMonth', 'filterDay', 'filterSector'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderFeatures);
    });

    document.getElementById('resetFilters').addEventListener('click', function() {
      document.getElementById('filterType').value = 'all';
      document.getElementById('filterMonth').value = 'all';
      document.getElementById('filterDay').value = 'all';
      document.getElementById('filterSector').value = 'all';
      renderFeatures();
    });

    const panel = document.getElementById('filterPanel');
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);

    renderFeatures();
  </script>
</body>
</html>
